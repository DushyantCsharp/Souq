[project]
name = "souq-evals"
version = "0.1.0"
description = "Search relevance evals: golden set, filter-parse cases, ablation harness, labelling + judge gate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "souq-common",
  "souq-search",
  "httpx>=0.27",
  "numpy>=2.0",
  "pyarrow>=17",
  "pyyaml>=6.0",
]

[project.scripts]
souq-evals = "souq_evals.__main__:main"

[tool.uv.sources]
souq-common = { workspace = true }
souq-search = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_evals"]
