name: eval

# PRs: offline ranking eval (no LLM, deterministic) -> sticky comment with the ablation table and deltas vs
# main -> fail if nDCG@10 of the production ablation drops > 1 point on any language slice, or if the
# harness's absolute floors (evals/thresholds.yaml) are missed.
# main pushes + nightly: publish the offline baseline artifact PRs compare against (the nightly run keeps
# it from expiring when main is quiet). Nightly: full eval with the LLM path, compared to the last good
# nightly.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "offline = deterministic, no LLM; full = LLM path (needs ANTHROPIC_API_KEY)"
        type: choice
        options: [offline, full]
        default: offline

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OTEL_SDK_DISABLED: "true"
  OPENSEARCH_URL: http://localhost:9200
  BASELINE_ARTIFACT: eval-report-offline
  FULL_ARTIFACT: eval-report-full
  # Harness entry point (evals/, search agent). Exit 0 pass, 1 thresholds missed, 2 setup error.
  EVAL_CMD: uv run --frozen --package souq-evals python -m souq_evals

jobs:
  offline:
    name: offline ranking eval
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'offline'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # locate + download the main-branch baseline artifact
      pull-requests: write # sticky PR comment
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports: ["9200:9200"]
        options: >-
          --ulimit nofile=65536:65536
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 60
    env:
      # Belt and braces: offline mode must never reach a model API.
      SOUQ_LLM_MODE: replay
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - id: inputs
        uses: ./.github/actions/eval-inputs
        with:
          github-token: ${{ github.token }}
          model-release-tag: ${{ vars.MODEL_RELEASE_TAG || 'models-v1' }}
      - name: Run offline eval
        id: eval
        env:
          SOUQ_EMBEDDER: ${{ steps.inputs.outputs.embedder }}
        run: |
          mkdir -p "$RUNNER_TEMP/eval"
          set +e
          $EVAL_CMD --offline --out "$RUNNER_TEMP/eval/report.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Fetch main-branch baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/fetch_eval_baseline.sh "$BASELINE_ARTIFACT" "$RUNNER_TEMP/eval/baseline" >> "$GITHUB_OUTPUT"
      - name: Compare + render
        id: compare
        env:
          BASELINE_RUN: ${{ steps.baseline.outputs.run_id }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          label=""
          if [[ -n "$BASELINE_RUN" ]]; then
            label="main @ \`${BASELINE_SHA:0:7}\` ([run]($SERVER/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN))"
          fi
          set +e
          python3 ci/eval_compare.py \
            --current "$RUNNER_TEMP/eval/report.json" \
            --baseline "$RUNNER_TEMP/eval/baseline/report.json" \
            --baseline-label "$label" \
            --markdown-out "$RUNNER_TEMP/eval/comment.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/eval/comment.md" ]]; then
            cat "$RUNNER_TEMP/eval/comment.md" >> "$GITHUB_STEP_SUMMARY"
            echo "rendered=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.compare.outputs.rendered == 'true'
        # Fork PRs get a read-only token; the step summary above still carries the table.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: ci/upsert_pr_comment.sh "$PR" "$RUNNER_TEMP/eval/comment.md"
      - name: Publish report (the PR baseline when on main)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref == 'refs/heads/main' && env.BASELINE_ARTIFACT || format('eval-report-{0}-{1}', github.event_name, github.run_id) }}
          path: ${{ runner.temp }}/eval/report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Gate
        env:
          HARNESS: ${{ steps.eval.outputs.code }}
          COMPARE: ${{ steps.compare.outputs.code }}
          EVENT: ${{ github.event_name }}
        run: |
          status=0
          if [[ "$HARNESS" != 0 ]]; then
            echo "::error title=eval harness::souq_evals exited $HARNESS (1 = evals/thresholds.yaml floor missed, 2 = setup error)"
            status=1
          fi
          if [[ "$COMPARE" == 1 && "$EVENT" != pull_request ]]; then
            # Already merged: flag it loudly, but keep publishing baselines from main.
            echo "::warning title=eval regression on main::nDCG@10 dropped vs the previous main baseline"
          elif [[ "$COMPARE" != 0 ]]; then
            echo "::error title=eval gate::eval_compare exited $COMPARE (1 = nDCG@10 regression > 1 pt, 2 = unusable report)"
            status=1
          fi
          exit "$status"

  full:
    name: nightly full eval (LLM path)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports: ["9200:9200"]
        options: >-
          --ulimit nofile=65536:65536
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 60
    env:
      SOUQ_LLM_MODE: live
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require the API key
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error title=missing secret::ANTHROPIC_API_KEY is not configured for this repository"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "false"
      - id: inputs
        uses: ./.github/actions/eval-inputs
        with:
          github-token: ${{ github.token }}
          model-release-tag: ${{ vars.MODEL_RELEASE_TAG || 'models-v1' }}
      - name: Run full eval
        id: eval
        env:
          SOUQ_EMBEDDER: ${{ steps.inputs.outputs.embedder }}
        run: |
          mkdir -p "$RUNNER_TEMP/eval"
          set +e
          $EVAL_CMD --full --out "$RUNNER_TEMP/eval/report.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Fetch previous nightly report
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/fetch_eval_baseline.sh "$FULL_ARTIFACT" "$RUNNER_TEMP/eval/baseline" >> "$GITHUB_OUTPUT"
      - name: Compare with previous nightly
        id: compare
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set +e
          python3 ci/eval_compare.py --title "Nightly full eval" \
            --current "$RUNNER_TEMP/eval/report.json" \
            --baseline "$RUNNER_TEMP/eval/baseline/report.json" \
            --baseline-label "previous nightly @ \`${BASELINE_SHA:0:7}\`" \
            --markdown-out "$RUNNER_TEMP/eval/summary.md"
          code=$?
          set -e
          if [[ -f "$RUNNER_TEMP/eval/summary.md" ]]; then cat "$RUNNER_TEMP/eval/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Only a clean night becomes the next baseline, so a bad night is compared against the last good one
      # again tomorrow instead of silently resetting the bar.
      - name: Publish nightly report
        if: steps.eval.outputs.code == '0' && steps.compare.outputs.code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FULL_ARTIFACT }}
          path: ${{ runner.temp }}/eval/report.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep the failing report for inspection
        if: (steps.eval.outputs.code != '0' || steps.compare.outputs.code != '0') && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-full-failed-${{ github.run_id }}
          path: ${{ runner.temp }}/eval/report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Gate (nightly alert)
        if: steps.eval.outputs.code != '0' || steps.compare.outputs.code != '0'
        env:
          HARNESS: ${{ steps.eval.outputs.code }}
          COMPARE: ${{ steps.compare.outputs.code }}
        run: |
          echo "::error title=nightly eval::souq_evals exited $HARNESS, eval_compare exited $COMPARE"
          exit 1
