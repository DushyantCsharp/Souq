[project]
name = "souq-admin-sdk"
version = "0.1.0"
description = "Typed Python client for the Souq public API, generated from packages/contracts/openapi.yaml"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "attrs>=24.2",
  "python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_admin_sdk"]

# src/souq_admin_sdk is generated (pnpm --filter @souq/contracts codegen); only tests/ is hand-written.
[tool.ruff]
extend = "../../pyproject.toml"
