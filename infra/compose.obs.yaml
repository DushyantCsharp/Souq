# Profile "obs" — owned by the observability agent. Included by infra/compose.yaml.
#   docker compose -p souq -f infra/compose.yaml --profile obs up -d
# Host ports: collector 4317/4318 (OTLP), 8889 (Prometheus exporter); Tempo 3200; Prometheus 9091; Grafana 3001.
# The Docker VM is shared with other stacks, so every container has a hard memory cap.

x-obs: &obs
  profiles: [obs]
  restart: unless-stopped

services:
  otel-collector:
    <<: *obs
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      # Let the Go GC work before memory_limiter (200 MiB) and the container cap (256 MiB) kick in.
      GOMEMLIMIT: 180MiB
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    mem_limit: 256m
    depends_on: [tempo]

  tempo:
    <<: *obs
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    # Named volumes are created root-owned; the image's default uid 10001 cannot write to them.
    user: "0:0"
    environment:
      GOMEMLIMIT: 300MiB
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200"
    mem_limit: 384m

  prometheus:
    <<: *obs
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --enable-feature=exemplar-storage
      # k6 can stream load-test results here (loadtest/run.sh K6_PROMETHEUS_RW=1).
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports:
      - "9091:9090"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    <<: *obs
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # dev only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/souq/search-slo.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Grafana >= 12 downloads "preinstalled" app plugins on boot; skip it (offline-friendly, less RAM).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/souq:ro
    ports:
      - "3001:3000"
    # Grafana 13 idles at ~260 MiB; leave room for dashboard query spikes.
    mem_limit: 448m
    depends_on:
      prometheus: { condition: service_healthy }
      tempo: { condition: service_started }

volumes:
  tempodata: {}
  promdata: {}
