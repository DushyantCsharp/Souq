# Souq local stack. Project name: souq  →  docker compose -p souq -f infra/compose.yaml up -d
# Core data services start by default; observability (obs), admin UIs (tools) and app images (apps) are profiles.
# Host ports avoid 5432/8080/9090 (taken on the dev machine).
name: souq

include:
  - compose.obs.yaml
  - compose.apps.yaml

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: souq
      POSTGRES_PASSWORD: souq
      POSTGRES_DB: souq
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200", "-c", "wal_level=logical"]
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souq -d souq"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    environment:
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v24.3.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["19092:19092", "18081:18081", "9644:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:v24.3.7
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/init/topics.sh"]
    volumes: ["./redpanda:/init:ro"]
    restart: "no"

  opensearch:
    <<: *restart
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
      bootstrap.memory_lock: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # Small write queue so backpressure (429 / es_rejected_execution_exception) is reachable locally.
      thread_pool.write.queue_size: "200"
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  redpanda-console:
    profiles: [tools]
    image: redpandadata/console:v2.8.2
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports: ["8088:8080"]
    depends_on: [redpanda]

  opensearch-dashboards:
    profiles: [tools]
    image: opensearchproject/opensearch-dashboards:2.19.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on: [opensearch]


volumes:
  pgdata: {}
  redpanda: {}
  osdata: {}
