# OpenTelemetry Collector (contrib) for the local Souq stack.
# SDKs (Python services, Node gateway/storefront) push OTLP here; traces go to Tempo after redaction and
# tail sampling, metrics are exposed for Prometheus to scrape on :8889.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Browser spans from the storefront dev server.
          allowed_origins: ["http://localhost:3000"]

processors:
  # First in every pipeline: refuse data before the container's 256 MiB limit OOM-kills us.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 40

  # Defence in depth for rule 6 (no query text in telemetry). SDKs already scrub these; this catches any
  # service or instrumentation that does not.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["url.query"], "REDACTED") where attributes["url.query"] != nil and attributes["url.query"] != ""
          - replace_pattern(attributes["url.path"], "\\?.*$", "")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
          - delete_key(attributes, "redis.search.query")
          - delete_matching_keys(attributes, "^redis\\.search\\.xdoc_.*")
          - delete_key(attributes, "souq.query.text") where resource.attributes["deployment.environment.name"] == "prod"

  # Keep every interesting trace, cap the boring ones. At dev traffic the rate limit keeps everything; at
  # the 200 RPS load test it keeps ~30 baseline traces/s plus all slow, failed, over-budget and LLM-path
  # traces — the ones Prometheus exemplars point at.
  tail_sampling:
    decision_wait: 5s
    num_traces: 20000
    expected_new_traces_per_sec: 300
    decision_cache:
      sampled_cache_size: 50000
      non_sampled_cache_size: 50000
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slower-than-standard-slo
        type: latency
        latency: { threshold_ms: 250 }
      - name: stage-over-budget
        type: boolean_attribute
        boolean_attribute: { key: souq.stage.exceeded, value: true }
      - name: llm-path
        type: string_attribute
        string_attribute: { key: souq.parse.path, values: [llm] }
      - name: baseline
        type: rate_limiting
        rate_limiting: { spans_per_second: 400 }

  batch:
    send_batch_size: 2048
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # OpenMetrics is required for exemplars (trace_id on histogram buckets → Grafana "view trace").
    enable_open_metrics: true
    # Keep instrument names exactly as in CLAUDE.md (search_latency, consumer_lag, …): dots → underscores,
    # but no unit/_total suffixes appended (counters are already named *_total). Replaces the deprecated
    # add_metric_suffixes: false, which this collector version ignores.
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    # Series of a process that stopped reporting disappear instead of flat-lining.
    metric_expiration: 10m
    resource_to_telemetry_conversion:
      enabled: false

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
