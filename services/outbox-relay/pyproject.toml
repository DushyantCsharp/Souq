[project]
name = "souq-outbox-relay"
version = "0.1.0"
description = "Transactional outbox relay: Postgres outbox (FOR UPDATE SKIP LOCKED) -> Redpanda catalog.changes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "souq-common",
  "confluent-kafka>=2.6",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "opentelemetry-api>=1.28",
]

[project.scripts]
souq-outbox-relay = "souq_outbox_relay.main:main"

[tool.uv.sources]
souq-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_outbox_relay"]
