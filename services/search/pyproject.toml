[project]
name = "souq-search"
version = "0.1.0"
description = "Bilingual catalog search: normalise -> parse (rule|llm|cache) -> bm25 || knn -> RRF -> rerank"
requires-python = ">=3.12,<3.13"
dependencies = [
  "souq-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "redis>=5.2",
  "anthropic>=1.0",
  "psycopg[binary]>=3.2",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "pyyaml>=6.0",
]

[project.scripts]
souq-search = "souq_search.__main__:main"

[tool.uv.sources]
souq-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_search"]
