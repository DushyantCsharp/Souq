[project]
name = "souq-indexer"
version = "0.1.0"
description = "catalog.changes consumer -> OpenSearch bulk indexer (AIMD backpressure, retry topics, DLQ) + souq-dlq admin CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "souq-common",
  "confluent-kafka>=2.6",
  "opensearch-py>=2.7",
  "pydantic>=2.9",
  "opentelemetry-api>=1.28",
]

[project.scripts]
souq-indexer = "souq_indexer.main:main"
souq-dlq = "souq_indexer.dlq_cli:main"

[tool.uv.sources]
souq-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_indexer"]
