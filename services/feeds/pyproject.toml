[project]
name = "souq-feeds"
version = "0.1.0"
description = "Supplier feed upload + streaming import into Postgres and the transactional outbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "souq-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "opentelemetry-api>=1.28",
]

[project.scripts]
souq-feeds = "souq_feeds.main:main"
souq-feeds-import = "souq_feeds.cli:main"

[tool.uv.sources]
souq-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/souq_feeds"]
